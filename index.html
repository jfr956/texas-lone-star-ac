<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Same-Day Cooling Repair – Rio Grande Valley</title>
<meta content="AC repair services in the Rio Grande Valley. Fast, reliable HVAC solutions for residential and commercial properties." name="description"/>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Font Awesome -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: #333;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        header {
            background: #041F3B;
            color: white;
            padding: 1rem 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
        }

        .logo h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.3rem;
            font-weight: 500;
            color: #e5e7eb;
            margin: 0;
        }

        .sponsor-line {
            font-size: 0.8rem;
            color: #9ca3af;
            font-style: italic;
            margin-top: 2px;
        }

        .header-contact {
            display: none;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(rgba(4, 31, 59, 0.95), rgba(4, 31, 59, 0.95)), 
                        linear-gradient(45deg, #041F3B, #CA130F);
            color: white;
            padding: 120px 0 80px;
            text-align: center;
            position: relative;
        }

        .hero h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .hero .subtitle {
            font-size: 1.5rem;
            margin-bottom: 30px;
            opacity: 0.95;
        }

        .hero .description {
            font-size: 1.1rem;
            margin-bottom: 40px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .cta-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-primary {
            background: #CA130F;
            color: #FFFFFF;
            box-shadow: 0 4px 15px rgba(202, 19, 15, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            background: #A00F0B;
            box-shadow: 0 6px 20px rgba(202, 19, 15, 0.6);
        }

        .btn-secondary {
            background: transparent;
            color: white;
            border: 2px solid white;
        }

        .btn-secondary:hover {
            background: white;
            color: #041F3B;
        }

        /* Trust Indicators */
        .trust-section {
            background: white;
            padding: 40px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .trust-indicators {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            text-align: center;
        }

        .trust-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .trust-item i {
            font-size: 2.5rem;
            color: #041F3B;
        }

        .trust-item h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #041F3B;
        }

        .trust-item p {
            font-size: 0.9rem;
            color: #6b7280;
        }

        /* Services Section */
        .services {
            padding: 80px 0;
            background: #f8fafc;
        }

        .section-title {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-title h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: #041F3B;
            margin-bottom: 15px;
        }

        .section-title p {
            font-size: 1.1rem;
            color: #6b7280;
            max-width: 600px;
            margin: 0 auto;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .service-card {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            transition: all 0.3s ease;
        }

        .service-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .service-card i {
            font-size: 3rem;
            color: #CA130F;
            margin-bottom: 20px;
        }

        .service-card h3 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.3rem;
            font-weight: 600;
            color: #041F3B;
            margin-bottom: 15px;
        }

        .service-card p {
            color: #6b7280;
            margin-bottom: 20px;
        }

        .service-card .btn {
            font-size: 1rem;
            padding: 12px 25px;
        }

        /* Why Choose Us */
        .why-choose {
            padding: 80px 0;
            background: white;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 40px;
            margin-top: 60px;
        }

        .feature-item {
            text-align: center;
        }

        .feature-icon {
            width: 80px;
            height: 80px;
            background: #041F3B;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            margin: 0 auto 20px;
        }

        .feature-icon i {
            font-size: 2rem;
            color: white;
        }

        .feature-item h3 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.3rem;
            font-weight: 600;
            color: #041F3B;
            margin-bottom: 15px;
        }

        /* Emergency Section */
        .emergency {
            background: #CA130F;
            color: white;
            padding: 60px 0;
            text-align: center;
        }

        .emergency h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .emergency p {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .emergency-phone {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-decoration: none;
            color: white;
            display: inline-block;
        }

        .emergency-phone:hover {
            background: #041F3B;
            transform: scale(1.05);
        }

        /* Footer */
        footer {
            background: #041F3B;
            color: white;
            padding: 60px 0 30px;
        }

        .footer-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 40px;
        }

        .footer-section h3 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            color: #FFFFFF;
            margin-bottom: 20px;
        }

        .footer-section p, .footer-section li {
            color: #d1d5db;
            margin-bottom: 10px;
        }

        .footer-section ul {
            list-style: none;
        }

        .footer-section a {
            color: #d1d5db;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer-section a:hover {
            color: #fbbf24;
        }

        .footer-bottom {
            border-top: 1px solid #374151;
            margin-top: 40px;
            padding-top: 20px;
            text-align: center;
            color: #9ca3af;
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }

            .hero .subtitle {
                font-size: 1.2rem;
            }

            .cta-buttons {
                flex-direction: column;
                align-items: center;
            }

            .header-contact {
                flex-direction: column;
                gap: 10px;
            }

            .emergency-phone {
                font-size: 2rem;
            }
        }
</style>
